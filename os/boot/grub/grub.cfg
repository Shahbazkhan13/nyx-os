# NyxOS GRUB Configuration
set default=0
set timeout=5

menuentry "NyxOS Live" {
    linux /boot/vmlinuz boot=live quiet splash
    initrd /boot/initrd.img
}

menuentry "NyxOS Live (Safe Mode)" {
    linux /boot/vmlinuz boot=live nomodeset
    initrd /boot/initrd.img
}

menuentry "NyxOS Installer" {
    linux /boot/vmlinuz boot=install
    initrd /boot/initrd.img
}
